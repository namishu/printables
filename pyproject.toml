[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "namishu-printables"
dynamic = ["version"]
description = "Printable cards and paper templates for learning and family activities."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/namishu_printables/assets/fonts/OFL.txt", "src/namishu_printables/assets/fonts/pinyin-OFL.txt"]
authors = [{name = "Namishu"}]
keywords = ["printable", "pdf", "education", "cards", "handwriting"]
classifiers = ["Environment :: Console", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = ["PyYAML>=6", "reportlab>=4", "pypinyin>=0.50", "fonttools>=4"]

[project.urls]
Homepage = "https://github.com/namishu/printables"
Repository = "https://github.com/namishu/printables"
Issues = "https://github.com/namishu/printables/issues"

[project.scripts]
namishu-printables = "namishu_printables.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pypdf>=5", "ruff>=0.11"]

[tool.setuptools.dynamic]
version = {attr = "namishu_printables.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"namishu_printables.rating_card" = ["config/*.yaml"]
namishu_printables = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.md"]
"namishu_printables.hanzi_card" = ["config/*.yaml", "data/*.txt"]
"namishu_printables.pinyin_chart" = ["config/*.yaml", "data/*.json"]
"namishu_printables.writing_paper" = ["config/*.yaml"]
"namishu_printables.reward_card" = ["config/*.yaml", "gfx/*.png"]
"namishu_printables.values_worksheet" = ["config/*.yaml", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["B", "C4", "E4", "E501", "E7", "E9", "F", "I", "RUF012", "SIM", "UP"]
