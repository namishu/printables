name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - name: Verify wheel installation away from source
        shell: bash
        run: |
          uv venv --python '${{ matrix.python }}' "$RUNNER_TEMP/printables-verify"
          if [[ "$RUNNER_OS" == Windows ]]; then
            verify_python="$RUNNER_TEMP/printables-verify/Scripts/python.exe"
          else
            verify_python="$RUNNER_TEMP/printables-verify/bin/python"
          fi
          uv pip install --python "$verify_python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$verify_python" -m namishu_printables --version
          "$verify_python" -m namishu_printables writing-paper grid -o verify-grid.pdf
          "$verify_python" -m namishu_printables hanzi-card 天地 -o verify-hanzi.pdf
          "$verify_python" -m namishu_printables pinyin-chart all -o verify-pinyin.pdf
          "$verify_python" -m namishu_printables reward-card -o verify-reward.pdf
          "$verify_python" -m namishu_printables values-worksheet -o verify-values.pdf
          "$verify_python" -m namishu_printables rating-card -o verify-score.pdf
