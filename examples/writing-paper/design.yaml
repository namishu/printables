# 尺寸和间距单位为毫米（mm），线宽单位为磅（pt），颜色格式为 #RRGGBB。
layout:
  width_mm: 210
  height_mm: 297
  margin_left_mm: 20
  margin_right_mm: 20
  margin_top_mm: 20
  margin_bottom_mm: 20

parameters:
  lined:
    rows: {default: 20, min: 1, max: 26}
    columns: {default: 1, min: 1, max: 3}
  grid:
    cell_size_mm: {default: 10, min: 5, max: 20}
  english:
    columns: {default: 1, min: 1, max: 3}

lined:
  layout:
    column_gap_mm: 2
  style:
    horizontal: {width_pt: 0.5, color: "#3b3b5c"}
    boundary: {width_pt: 1.5, color: "#343452"}
    vertical: {width_pt: 0.3, color: "#9a9aa8", dashed: true}

grid:
  layout:
    horizontal_alignment: center
    vertical_alignment: center
  style:
    horizontal: {width_pt: 0.6, color: "#74748c"}
    boundary: {width_pt: 1.5, color: "#74748c"}
    vertical: {width_pt: 0.3, color: "#b8b8c4"}

english:
  layout:
    groups: 16
    group_height_mm: 9
    column_gap_mm: 2
  style:
    horizontal: {width_pt: 0.4, color: "#aaaab8"}
    baseline: {width_pt: 0.8, color: "#7474a3"}
    vertical: {width_pt: 0.3, color: "#9a9aa8", dashed: true}
